<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ospital ng Makati Inventory Management System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="https://maxterrenal-hash.github.io/justculture/osmak-logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <img src="https://maxterrenal-hash.github.io/justculture/osmak-logo.png" alt="OsMak" />
      <div class="brand-title">
        <div>Ospital ng Makati</div>
        <small>Inventory Management System</small>
      </div>
    </div>
    <nav>
      <button data-view="registration" class="active">Registration</button>
      <button data-view="log">Log</button>
      <button data-view="transfer">Transfer</button>
      <button data-view="inventory">Inventory</button>
      <button data-view="history">Transaction History</button>
      <button data-view="analysis">Data Analysis</button>
    </nav>
    <footer>CSR Panel • CENTRAL</footer>
  </aside>

  <main id="main"></main>

  <template id="tpl-registration">
    <section class="card">
      <h2>Item Registration</h2>
      <div class="grid">
        <label>Item Code<input id="r-code" placeholder="e.g., SYR-05"></label>
        <label>Item Name<input id="r-name" placeholder="e.g., Syringe 5 mL"></label>
        <label>Brand<input id="r-brand" placeholder="e.g., Terumo"></label>
        <label>Category<input id="r-cat" placeholder="e.g., Consumables"></label>
        <label>Critical Level<input id="r-crit" type="number" min="0" value="0"></label>
        <label class="span2">Remarks<input id="r-remarks" placeholder="Optional"></label>
      </div>
      <div class="row">
        <button id="btn-save-item">Save / Update Item</button>
        <span id="reg-msg" class="msg"></span>
      </div>
    </section>
  </template>

  <template id="tpl-log">
    <section class="card">
      <h2>Log Stock (CENTRAL)</h2>
      <div class="grid">
        <label class="span2">Find Item
          <input id="l-search" placeholder="Type to search name/code/brand/category">
        </label>
        <div id="l-suggestions" class="suggest"></div>
        <label>Qty<input id="l-qty" type="number" min="1" value="1"></label>
        <label class="span2">Notes<input id="l-notes" placeholder="Optional"></label>
        <button id="l-add">Add to Cart</button>
      </div>
      <h3>Cart</h3>
      <table class="table" id="l-cart"></table>
      <div class="row">
        <button id="l-confirm">Confirm Stock-in</button>
        <span id="l-msg" class="msg"></span>
      </div>
    </section>
  </template>

  <template id="tpl-transfer">
    <section class="card">
      <h2>Transfer (CENTRAL → Ward)</h2>
      <div class="grid">
        <label class="span2">Find Item
          <input id="t-search" placeholder="Type to search">
        </label>
        <div id="t-suggestions" class="suggest"></div>
        <label>Qty<input id="t-qty" type="number" min="1" value="1"></label>
        <label>Ward
          <select id="t-ward"></select>
        </label>
        <label class="span2">Notes<input id="t-notes" placeholder="Optional"></label>
        <button id="t-add">Add to Cart</button>
      </div>
      <h3>Cart</h3>
      <table class="table" id="t-cart"></table>
      <div class="row">
        <button id="t-confirm">Confirm Transfer</button>
        <span id="t-msg" class="msg"></span>
      </div>
    </section>
  </template>

  <template id="tpl-inventory">
    <section class="card">
      <h2>Inventory (CENTRAL)</h2>
      <div class="row">
        <input id="i-search" placeholder="Search inventory">
        <button id="i-refresh">Refresh</button>
      </div>
      <table class="table" id="i-table"></table>
      <small>Critical items are highlighted.</small>
    </section>
  </template>

  <template id="tpl-history">
    <section class="card">
      <h2>Transaction History</h2>
      <div class="grid">
        <label>From<input id="h-from" type="date"></label>
        <label>To<input id="h-to" type="date"></label>
        <button id="h-load">Load</button>
        <button id="h-export">Export CSV</button>
      </div>
      <table class="table" id="h-table"></table>
      <small>Click 🗑 to delete a transaction (auto-reverse stock).</small>
      <span id="h-msg" class="msg"></span>
    </section>
  </template>

  <template id="tpl-analysis">
    <section class="card">
      <h2>Data Analysis</h2>
      <div class="grid">
        <label>From<input id="a-from" type="date"></label>
        <label>To<input id="a-to" type="date"></label>
        <button id="a-run">Run</button>
      </div>
      <div class="kpis" id="a-kpis"></div>
      <div class="grid2">
        <div><h3>Fast Moving</h3><table class="table" id="a-fast"></table></div>
        <div><h3>Slow Moving</h3><table class="table" id="a-slow"></table></div>
        <div><h3>Unused</h3><table class="table" id="a-unused"></table></div>
        <div><h3>Critical Stock</h3><table class="table" id="a-critical"></table></div>
      </div>
    </section>
  </template>

<script src="app.js"></script>
</body>
</html>
