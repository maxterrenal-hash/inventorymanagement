<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ospital ng Makati Inventory Management System</title>
<style>
  :root{--osmak:#009a3e;--osmak-d:#007530;--bg:#f7f7f7;--card:#fff;--txt:#111827;--muted:#6b7280;--border:#e5e7eb;--danger:#dc2626}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--txt)}
  header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:5}
  header img{height:36px}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sp{flex:1}
  header .mini{display:flex;gap:8px;align-items:center}
  header button,.btn{border:1px solid var(--osmak-d);background:var(--osmak);color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}
  header button:hover,.btn:hover{background:var(--osmak-d)}
  .layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 60px)}
  .sidebar{border-right:1px solid var(--border);background:#fff;padding:12px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
  .sidebar h3{margin:8px 8px 12px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .menu{display:flex;flex-direction:column;gap:6px}
  .menu button{justify-content:flex-start;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer}
  .menu button.active,.menu button:hover{background:var(--osmak);color:#fff;border-color:var(--osmak-d);font-weight:600}
  main{padding:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap}.row .col{flex:1;min-width:220px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  input,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;background:#fff}
  input[type="number"]{text-align:right}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:14px}
  th{background:#fafafa;text-align:left;color:#374151}
  .t-right{text-align:right}
  .hint{font-size:12px;color:var(--muted)}
  .scrollbox{max-height:360px;overflow:auto;border:1px solid var(--border);border-radius:12px}
  .scrollbox.inventory{max-height:700px}
  .scrollbox thead th{position:sticky;top:0;z-index:1;background:#fafafa}
  .hidden{display:none}
  .row-out{background:#fef2f2}
  .row-crit{background:#fff8e1}
  .row-ok{background:#f0fdf4}
</style>
</head>
<body>
<header>
  <img src="https://maxterrenal-hash.github.io/justculture/osmak-logo.png" alt="OsMak"/>
  <h1>Ospital ng Makati Inventory Management System</h1>
  <div class="sp"></div>
  <div class="mini">
    <button id="btnBackup">Backup</button>
    <button id="btnRestore">Restore</button>
    <button id="btnSync">Sync</button>
    <button id="btnPing">Ping</button>
    <input id="restoreFile" type="file" accept="application/json" class="hidden"/>
    <span id="syncStatus" class="hint"></span>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <h3>CSR Menu</h3>
    <div class="menu">
      <button data-view="registration" class="active">Registration</button>
      <button data-view="log">Log</button>
      <button data-view="transfer">Transfer</button>
      <button data-view="inventory">Inventory</button>
    </div>
  </aside>

  <main>
    <!-- Registration -->
    <section id="view-registration" class="card">
      <h2>Item Registration</h2>
      <div class="row">
        <div class="col"><label>Item Code</label><input id="regCode"/></div>
        <div class="col"><label>Item Name</label><input id="regName"/></div>
        <div class="col"><label>Brand</label><input id="regBrand"/></div>
        <div class="col"><label>Category</label><input id="regCat"/></div>
        <div class="col"><label>Price</label><input id="regPrice" type="number" min="0" step="0.01"/></div>
        <div class="col"><label>Critical Level</label><input id="regCrit" type="number" min="0" step="1"/></div>
      </div>
      <div class="row"><div class="col"><label>Remarks</label><input id="regRemarks"/></div></div>
      <div class="actions"><button class="btn" id="btnAddItem">Save Item</button><span id="regHint" class="hint"></span></div>
      <div class="scrollbox" style="margin-top:12px">
        <table id="itemsTable"><thead><tr><th>Code</th><th>Name</th><th>Brand</th><th>Price</th><th>Category</th><th>Critical</th><th>Remarks</th></tr></thead><tbody></tbody></table>
      </div>
    </section>

    <!-- Log -->
    <section id="view-log" class="card hidden">
      <h2>Log — Stock In (CENTRAL)</h2>
      <div class="row">
        <div class="col"><label>Search Item</label><input id="logSearch" placeholder="Type name/code/brand..." autocomplete="off"/></div>
        <div class="col"><label>Qty</label><input id="logQty" type="number" min="1" step="1"/></div>
      </div>
      <div class="actions"><button class="btn" id="btnLogAdd">Add to Cart</button><span id="logHint" class="hint"></span></div>
      <div class="scrollbox" style="margin-top:12px"><table id="logItemsTbl"><thead><tr><th>Code</th><th>Name</th><th>Brand</th><th>Category</th></tr></thead><tbody></tbody></table></div>
    </section>

    <!-- Transfer -->
    <section id="view-transfer" class="card hidden">
      <h2>Transfer — CENTRAL → Ward</h2>
      <div class="row">
        <div class="col"><label>Search Item</label><input id="trSearch" placeholder="Type name/code..." autocomplete="off"/></div>
        <div class="col"><label>Qty</label><input id="trQty" type="number" min="1" step="1"/></div>
      </div>
      <div class="scrollbox" style="margin-top:12px"><table id="trItemsTbl"><thead><tr><th>Code</th><th>Name</th><th>Brand</th><th>Category</th></tr></thead><tbody></tbody></table></div>
    </section>

    <!-- Inventory -->
    <section id="view-inventory" class="card hidden">
      <h2>Inventory — CENTRAL</h2>
      <div class="scrollbox inventory" style="margin-top:12px">
        <table id="invTbl"><thead><tr><th>Code</th><th>Name</th><th>Brand</th><th>Price</th><th>Category</th><th class="t-right">Qty</th><th>Status</th></tr></thead><tbody></tbody></table>
      </div>
    </section>
  </main>
</div>

<script>
/* ===== CONFIG ===== */
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzuS-LZ_55NzNAoR4a7FbBFCpfmL3dUzXK-LHZhFQ64k551JftUvBQ2hQXENaTK2tng/exec';  // <-- put your Apps Script Web App URL here
const DB_KEY='osmak_ims_v1';const CENTRAL='CENTRAL';

/* ===== HELPERS ===== */
const fmtPHP=(n)=>new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP'}).format(Number(n||0));
const nowISO=()=>new Date().toISOString();
const loadDB=()=>{const def={items:[],stock:[],tx:[]};try{return JSON.parse(localStorage.getItem(DB_KEY))||def}catch{return def}};
const saveDB=(db)=>localStorage.setItem(DB_KEY,JSON.stringify(db));
function getItem(code){return loadDB().items.find(x=>x.ItemCode===code)}
function findItemByQuery(q){const s=q.trim().toLowerCase();if(!s)return[];return loadDB().items.filter(it=>[it.ItemCode,it.ItemName,it.Brand,it.Category].some(v=>(v||'').toLowerCase().includes(s))).slice(0,50)}

/* ===== REGISTRATION ===== */
function renderItems(){const tb=document.querySelector('#itemsTable tbody');const items=loadDB().items;
tb.innerHTML=items.map(it=>`<tr data-code="${it.ItemCode}"><td>${it.ItemCode}</td><td>${it.ItemName}</td><td>${it.Brand||''}</td><td class="t-right">${fmtPHP(it.UnitPrice||0)}</td><td>${it.Category||''}</td><td class="t-right">${it.CriticalLevel||''}</td><td>${it.Remarks||''}</td></tr>`).join('');
tb.querySelectorAll('tr[data-code]').forEach(tr=>tr.onclick=()=>{const it=getItem(tr.dataset.code);regCode.value=it.ItemCode;regName.value=it.ItemName;regBrand.value=it.Brand;regCat.value=it.Category;regPrice.value=it.UnitPrice;regCrit.value=it.CriticalLevel;regRemarks.value=it.Remarks;regHint.textContent='Editing '+it.ItemCode;})}
btnAddItem.onclick=()=>{const db=loadDB();const code=regCode.value.trim().toUpperCase();if(!code){regHint.textContent='Item Code required';return;}
const rec={ItemCode:code,ItemName:regName.value,Brand:regBrand.value,Category:regCat.value,UnitPrice:Number(regPrice.value||0),CriticalLevel:Number(regCrit.value||0),Remarks:regRemarks.value,CreatedAt:nowISO(),UpdatedAt:nowISO()};
const i=db.items.findIndex(x=>x.ItemCode===code);if(i>=0)db.items[i]=rec;else db.items.push(rec);saveDB(db);regHint.textContent='Saved '+code;renderItems();renderInventory();};

/* ===== SEARCH FIX ===== */
function renderLogItems(){const tb=document.querySelector('#logItemsTbl tbody');const q=logSearch.value.trim();if(!q){tb.innerHTML='';return;}const list=findItemByQuery(q);
tb.innerHTML=list.length?list.map(it=>`<tr data-code="${it.ItemCode}"><td>${it.ItemCode}</td><td>${it.ItemName}</td><td>${it.Brand||''}</td><td>${it.Category||''}</td></tr>`).join(''):'<tr><td colspan="4" class="hint">No matches.</td></tr>';}
logSearch.addEventListener('input',renderLogItems);logSearch.addEventListener('focus',renderLogItems);
function renderTrItems(){const tb=document.querySelector('#trItemsTbl tbody');const q=trSearch.value.trim();if(!q){tb.innerHTML='';return;}const list=findItemByQuery(q);
tb.innerHTML=list.length?list.map(it=>`<tr data-code="${it.ItemCode}"><td>${it.ItemCode}</td><td>${it.ItemName}</td><td>${it.Brand||''}</td><td>${it.Category||''}</td></tr>`).join(''):'<tr><td colspan="4" class="hint">No matches.</td></tr>';}
trSearch.addEventListener('input',renderTrItems);trSearch.addEventListener('focus',renderTrItems);

/* ===== INVENTORY ===== */
function renderInventory(){const db=loadDB();const tb=document.querySelector('#invTbl tbody');const rows=[];
db.stock.filter(s=>s.Ward===CENTRAL).forEach(s=>{const it=getItem(s.ItemCode);if(!it)return;const crit=Number(it.CriticalLevel||0);const cls=s.Qty<=0?'row-out':(crit&&s.Qty<=crit?'row-crit':'row-ok');
const status=s.Qty<=0?'<span class="pill bad">Out</span>':(crit&&s.Qty<=crit?'<span class="pill warn">Critical</span>':'<span class="pill">OK</span>');
rows.push(`<tr class="${cls}"><td>${it.ItemCode}</td><td>${it.ItemName}</td><td>${it.Brand||''}</td><td class="t-right">${fmtPHP(it.UnitPrice||0)}</td><td>${it.Category||''}</td><td class="t-right">${s.Qty}</td><td>${status}</td></tr>`);});
tb.innerHTML=rows.join('')||'<tr><td colspan="7" class="hint">No records.</td></tr>';}

/* ===== SYNC + PING ===== */
btnPing.onclick=async()=>{try{const r=await fetch(BACKEND_URL,{method:'GET',cache:'no-store'});const t=await r.text();alert('Ping response: '+t);}catch(e){alert('Ping failed: '+e.message);}};
btnSync.onclick=async()=>{try{const db=loadDB();const r=await fetch(BACKEND_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'sync',payload:db})});
const t=await r.text();if(t.includes('"ok":true')){alert('Synced to Google Sheets.');localStorage.setItem('lastSync',new Date().toLocaleString());syncStatus.textContent='Last sync: '+new Date().toLocaleString();}else throw new Error(t);}catch(e){alert('Sync error: '+e.message);}};

/* ===== SERVICE WORKER ===== */
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(()=>console.log('SW registered')).catch(console.warn));}

/* ===== INIT ===== */
function switchView(v){document.querySelectorAll('.menu button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
document.querySelectorAll('main section').forEach(s=>s.classList.toggle('hidden',s.id!=='view-'+v));
if(v==='registration')renderItems();if(v==='inventory')renderInventory();if(v==='log')renderLogItems();if(v==='transfer')renderTrItems();}
document.querySelectorAll('.menu button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
renderItems();renderInventory();
</script>
</body>
</html>
