<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ospital ng Makati - Inventory Management System</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #009a3e;
        font-family: system-ui, -apple-system, sans-serif;
    }

    .card {
        width: 360px;
        background: #fff;
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 8px 22px rgba(0,0,0,0.25);
        text-align: center;
        animation: fadeIn 0.3s ease-out;
    }

    .card h1 {
        margin: 0;
        font-size: 1.6rem;
        font-weight: 700;
    }

    .card p {
        margin-top: 4px;
        margin-bottom: 20px;
        font-size: 0.95rem;
        color: #444;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 0.95rem;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #009a3e;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
    }

    button:hover {
        background: #007530;
    }

    #error {
        color: red;
        margin-top: 15px;
        font-size: 0.9rem;
        min-height: 20px;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>

<body>

<div class="card">
    <h1>Ospital ng Makati</h1>
    <p>Inventory Management System</p>

    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="handleLogin()">Login</button>

    <div id="error"></div>
</div>


<script>
function handleLogin() {
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value.trim();

    if (!u || !p) {
        document.getElementById("error").innerHTML = "Please fill in all fields.";
        return;
    }

    // GAS backend call
    google.script.run
        .withSuccessHandler(function(res) {
            if (!res || !res.success) {
                document.getElementById("error").innerHTML = "Invalid username or password.";
                return;
            }

            if (res.role === "CSR") {
                window.location.href = "csr.html"; 
            } else if (res.role === "Ward") {
                window.location.href = "ward.html";
            } else {
                document.getElementById("error").innerHTML = "Unknown account type.";
            }
        })
        .loginUser(u, p);
}
</script>

</body>
</html>
